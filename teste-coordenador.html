<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel do Coordenador - Validação</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: auto; background-color: #f4f4f9;}
        input[type="text"], input[type="number"], button { width: 100%; padding: 10px; margin-bottom: 15px; box-sizing: border-box; }
        .btn-buscar { background: #343a40; color: white; border: none; cursor: pointer; font-size: 16px; font-weight: bold; }
        .btn-buscar:hover { background: #23272b; }
        pre { background: #222; color: #0f0; padding: 15px; border-radius: 5px; overflow-x: auto; font-size: 14px;}
        
        /* Estilo dos Cards da Fila */
        .card { background: white; border: 1px solid #ddd; padding: 20px; margin-top: 15px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);}
        .card img { max-width: 100%; max-height: 400px; margin-top: 10px; border-radius: 4px; border: 1px solid #eee; }
        .info-aluno { background: #e9ecef; padding: 10px; border-radius: 4px; margin-bottom: 15px; font-size: 14px; }
        
        /* Área de Ação (Aprovar/Recusar) */
        .acao-box { background: #fff3cd; padding: 15px; border-radius: 4px; border: 1px solid #ffeeba; margin-top: 15px; }
        .btn-aprovar { background: #28a745; color: white; border: none; padding: 10px; cursor: pointer; font-weight: bold; width: 48%; }
        .btn-recusar { background: #dc3545; color: white; border: none; padding: 10px; cursor: pointer; font-weight: bold; width: 48%; float: right; }
    </style>
</head>
<body>
    <h2>👨‍🏫 Painel do Coordenador - Fila de Análise</h2>
    
    <label>Token do Coordenador:</label>
    <input type="text" id="token" placeholder="Cole o token JWT de um usuário Coordenador aqui..." required>
    
    <button class="btn-buscar" onclick="listarFila()">Buscar Fila de Pendentes</button>

    <h3>Fila de Certificados:</h3>
    <div id="galeria">A fila está vazia ou aguardando busca...</div>

    <h3>Log do Servidor:</h3>
    <pre id="resposta">Aguardando...</pre>

    <script>
        async function listarFila() {
            const token = document.getElementById('token').value.trim();
            const divResposta = document.getElementById('resposta');
            const divGaleria = document.getElementById('galeria');
            
            divResposta.innerText = "Buscando fila... ⏳";
            divGaleria.innerHTML = "";

            try {
                // Chama a rota GET de pendentes
                const response = await fetch('https://backend-sistema-horas-complementares.onrender.com/api/certificados/pendentes', {
                    method: 'GET',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                const data = await response.json();
                divResposta.innerText = JSON.stringify(data, null, 2);

                if (response.ok && data.length > 0) {
                    data.forEach(cert => {
                        // Monta o Card para cada certificado na fila
                        divGaleria.innerHTML += `
                            <div class="card" id="card-${cert.id}">
                                <div class="info-aluno">
                                    <strong>👤 Aluno:</strong> ${cert.aluno.nome} (${cert.aluno.email})
                                </div>
                                <h4>Atividade: ${cert.tituloAtividade}</h4>
                                <p><strong>Área:</strong> ${cert.area.nome}</p>
                                <p><strong>Horas Informadas pelo Aluno:</strong> ${cert.cargaHorariaInformada}h</p>
                                
                                ${cert.imagem ? `<img src="${cert.imagem}" alt="Certificado">` : '<p><i>Sem imagem anexada</i></p>'}
                                
                                <div class="acao-box">
                                    <label><strong>Horas a Validar:</strong></label>
                                    <input type="number" id="horas-${cert.id}" value="${cert.cargaHorariaInformada}">
                                    
                                    <div style="margin-top: 10px;">
                                        <button class="btn-aprovar" onclick="avaliar(${cert.id}, 'APROVADO')">✅ Aprovar</button>
                                        <button class="btn-recusar" onclick="avaliar(${cert.id}, 'RECUSADO')">❌ Recusar</button>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                } else if (response.ok) {
                    divGaleria.innerHTML = "<p>✅ Uhu! Não há certificados pendentes na fila.</p>";
                }

            } catch (error) {
                divResposta.innerText = 'Erro: ' + error.message;
            }
        }

        async function avaliar(certificadoId, status) {
            const token = document.getElementById('token').value.trim();
            const horasInput = document.getElementById(`horas-${certificadoId}`).value;
            const divResposta = document.getElementById('resposta');

            divResposta.innerText = `Enviando avaliação (${status})... ⏳`;

            try {
                // Chama a rota PATCH para atualizar o certificado
                const response = await fetch(`https://backend-sistema-horas-complementares.onrender.com/api/certificados/${certificadoId}/validar`, {
                    method: 'PATCH', // Usamos PATCH pois estamos apenas atualizando uma parte do dado
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        status: status,
                        horasValidadas: Number(horasInput)
                    })
                });

                const data = await response.json();
                divResposta.innerText = JSON.stringify(data, null, 2);

                if (response.ok) {
                    alert(`Sucesso! Certificado ${status}.`);
                    // Remove o card da tela, pois não é mais "PENDENTE"
                    document.getElementById(`card-${certificadoId}`).remove(); 
                } else {
                    alert(`Erro ao validar: ${data.erro || data.message}`);
                }
            } catch (error) {
                divResposta.innerText = 'Erro: ' + error.message;
            }
        }
    </script>
</body>
</html>
